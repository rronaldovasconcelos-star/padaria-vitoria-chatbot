<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestão & Pedidos · Padaria Vitória</title>
  <link rel="icon" href="/img/icone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/painel.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="lateral" id="lateral" aria-label="Menu">
      <div class="lateral-topo">
        <a class="marca" href="/"><span class="marca-selo" aria-hidden="true"></span>
          <span><span class="marca-nome">Padaria Vitória</span><span class="marca-sub">Gestão &amp; Pedidos</span></span></a>
        <button class="btn-menu" type="button" id="recolher" aria-label="Recolher o menu"></button>
      </div>
      <nav class="menu" id="menu"></nav>
      <div class="menu menu-rodape" id="menuRodape"></div>
    </aside>
    <div class="fundo-menu" id="fundoMenu" hidden></div>

    <div class="principal">
      <header class="topo">
        <button class="btn-menu" type="button" id="abrirMenu" aria-label="Abrir o menu"></button>
        <h1 class="topo-titulo" id="topoTitulo">Dashboard</h1>
        <div class="topo-acoes">
          <a class="sino" id="sino" href="#financeiro" aria-label="Comprovantes PIX para aprovar"></a>
          <div class="usuario"><span class="avatar" aria-hidden="true">GE</span>
            <span><b>Gerência</b><small>Gerencia</small></span></div>
        </div>
      </header>
      <main id="vista" class="vista"></main>
    </div>
  </div>

  <dialog id="dialogo" class="dialogo">
    <form method="dialog" class="dialogo-fechar"><button class="btn btn-peq" aria-label="Fechar">Fechar</button></form>
    <div id="dialogoCorpo"></div>
  </dialog>

  <script type="module" src="/js/painel.js"></script>
</body>
</html>
